name: Debt-budget accounting
on: [push, pull_request]
permissions:
  contents: read
jobs:
  debt-budget:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node debt-budget/check.mjs
